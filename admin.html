<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R.E.S.K — Admin</title>

 <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 24px;
      border-bottom: 1px solid #444;
      background: #171717;
    }

    h1 {
      margin: 0;
      color: #8b1e2d;
      letter-spacing: 4px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    input, textarea, button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #555;
      background: #1b1b1b;
      color: white;
      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #8b1e2d;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #a52638;
    }

    .top {
      background: #191919;
      padding: 20px;
      border: 1px solid #333;
      margin-bottom: 25px;
    }

    .question {
      background: #191919;
      border: 1px solid #333;
      padding: 20px;
      margin-bottom: 18px;
    }

    .question-text {
      font-size: 18px;
      margin-bottom: 15px;
      white-space: pre-wrap;
    }

    .status {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 12px;
    }

    #message {
      margin-top: 12px;
      color: #aaa;
    }

    select {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 1px solid #555;
  background: #1b1b1b;
  color: white;
  font: inherit;
}

.post {
  background: #191919;
  border: 1px solid #333;
  padding: 20px;
  margin-bottom: 18px;
}

.post-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.post-meta {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 12px;
}

.post-text {
  white-space: pre-wrap;
  margin-bottom: 15px;
}

.post-actions {
  display: flex;
  gap: 10px;
}

.post-actions button {
  margin-top: 0;
}.hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>R.E.S.K — ADMIN</h1>
</header>

<main>

  <section class="top">
    <label>Admin Token</label>
    <input
      id="token"
      type="password"
      placeholder="Enter your ADMIN_TOKEN"
      autocomplete="off"
    >

    <button onclick="login()">ENTER ADMIN</button>

    <div id="message"></div>
  </section>

  <section id="dashboard" class="hidden">
    <h2>Q&A Inbox</h2>
    <div id="questions"></div>
  </section>
<section id="postsDashboard" class="hidden">
  <h2>New / Events — Posts</h2>

  <div class="top">
    <h3>Create Post</h3>

    <label>Type</label>
    <select id="postType">
      <option value="news">NEWS</option>
      <option value="music">MUSIC</option>
      <option value="event">EVENT</option>
      <option value="signal">SIGNAL</option>
    </select>

    <label>Title</label>
    <input
      id="postTitle"
      type="text"
      placeholder="Post title"
    >

    <label>Text</label>
    <textarea
      id="postText"
      placeholder="Write the post..."
    ></textarea>

    <label>Date Label</label>
    <input
      id="postDate"
      type="text"
      placeholder="OCTOBER 2026"
    >

    <label>Post Number</label>
    <input
      id="postNumber"
      type="text"
      placeholder="0048"
    >

    <label>Status</label>
    <select id="postStatus">
      <option value="draft">DRAFT</option>
      <option value="published">PUBLISHED</option>
    </select>

    <button onclick="createPost()">CREATE POST</button>
  </div>

  <h3>Existing Posts</h3>
  <div id="posts"></div>
</section>
</main>

<script>
const API = "https://resk-qa.dxeitypro.workers.dev";

let adminToken = "";

async function login() {
  adminToken = document.getElementById("token").value.trim();

  if (!adminToken) {
    document.getElementById("message").textContent =
      "Enter your admin token.";
    return;
  }

 await loadQuestions();
await loadPosts();

document.getElementById("postsDashboard")
  .classList.remove("hidden");
}

async function loadQuestions() {
  const message = document.getElementById("message");
  const dashboard = document.getElementById("dashboard");
  const questionsBox = document.getElementById("questions");

  message.textContent = "Loading...";

  try {
    const response = await fetch(
      API + "/api/admin/questions",
      {
        headers: {
          "Authorization": "Bearer " + adminToken
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      adminToken = "";
      message.textContent = "Unauthorized — check your token.";
      dashboard.classList.add("hidden");
      return;
    }

    message.textContent = "Admin access granted.";
    dashboard.classList.remove("hidden");

    questionsBox.innerHTML = "";

    if (!data.questions || data.questions.length === 0) {
      questionsBox.innerHTML =
        "<p>No questions yet.</p>";
      return;
    }

    data.questions.forEach(q => {
      const card = document.createElement("div");
      card.className = "question";

      const text = document.createElement("div");
      text.className = "question-text";
      text.textContent = q.question;

      const status = document.createElement("div");
      status.className = "status";
      status.textContent =
        "Status: " + q.status +
        " • Submitted: " + q.created_at;

      card.appendChild(text);
      card.appendChild(status);

      if (q.status === "published") {
        const answer = document.createElement("div");
        answer.className = "status";
        answer.textContent = "Answer: " + (q.answer || "");
        card.appendChild(answer);
      } else {
        const textarea = document.createElement("textarea");
        textarea.placeholder = "Write your answer...";

        const button = document.createElement("button");
        button.textContent = "ANSWER + PUBLISH";

        button.onclick = () =>
          publishAnswer(q.id, textarea.value);

        card.appendChild(textarea);
        card.appendChild(button);
      }

      questionsBox.appendChild(card);
    });

  } catch (error) {
    message.textContent =
      "Could not connect to the Q&A server.";
  }
}

async function publishAnswer(id, answer) {
  answer = answer.trim();

  if (!answer) {
    alert("Write an answer first.");
    return;
  }

  try {
    const response = await fetch(
      API + "/api/admin/questions/" + id + "/answer",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + adminToken
        },
        body: JSON.stringify({
          answer: answer
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "Could not publish answer.");
      return;
    }

    alert("Published!");

    await loadQuestions();

  } catch (error) {
    alert("Could not connect to the server.");
  }
}
// ==================================
// POSTS ADMIN
// ==================================

async function loadPosts() {
  const postsBox = document.getElementById("posts");

  try {
    const response = await fetch(
      API + "/api/admin/posts",
      {
        headers: {
          "Authorization": "Bearer " + adminToken
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      postsBox.innerHTML =
        "<p>Could not load posts.</p>";
      return;
    }

    postsBox.innerHTML = "";

    if (!data.posts || data.posts.length === 0) {
      postsBox.innerHTML =
        "<p>No posts yet.</p>";
      return;
    }

    data.posts.forEach(post => {
      const card = document.createElement("div");
      card.className = "post";

      const title = document.createElement("div");
      title.className = "post-title";
      title.textContent = post.title;

      const meta = document.createElement("div");
      meta.className = "post-meta";
      meta.textContent =
        post.type.toUpperCase() +
        " • " +
        post.status.toUpperCase() +
        " • " +
        post.date_label +
        " • #" +
        post.post_number;

      const text = document.createElement("div");
      text.className = "post-text";
      text.textContent = post.text;

      const actions = document.createElement("div");
      actions.className = "post-actions";

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "DELETE";

      deleteButton.onclick = () =>
        deletePost(post.id);

      actions.appendChild(deleteButton);

      card.appendChild(title);
      card.appendChild(meta);
      card.appendChild(text);
      card.appendChild(actions);

      postsBox.appendChild(card);
    });

  } catch (error) {
    postsBox.innerHTML =
      "<p>Could not connect to the server.</p>";
  }
}


async function createPost() {
  const type =
    document.getElementById("postType").value;

  const title =
    document.getElementById("postTitle").value.trim();

  const text =
    document.getElementById("postText").value.trim();

  const dateLabel =
    document.getElementById("postDate").value.trim();

  const postNumber =
    document.getElementById("postNumber").value.trim();

  const status =
    document.getElementById("postStatus").value;

  if (!title || !text || !dateLabel || !postNumber) {
    alert("Fill out all post fields first.");
    return;
  }

  try {
    const response = await fetch(
      API + "/api/admin/posts",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + adminToken
        },
        body: JSON.stringify({
          type: type,
          title: title,
          text: text,
          date_label: dateLabel,
          post_number: postNumber,
          status: status
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "Could not create post.");
      return;
    }

    alert("Post created!");

    document.getElementById("postTitle").value = "";
    document.getElementById("postText").value = "";
    document.getElementById("postDate").value = "";
    document.getElementById("postNumber").value = "";

    await loadPosts();

  } catch (error) {
    alert("Could not connect to the server.");
  }
}


async function deletePost(id) {
  if (!confirm("Delete this post?")) {
    return;
  }

  try {
    const response = await fetch(
      API + "/api/admin/posts/" + id,
      {
        method: "DELETE",
        headers: {
          "Authorization": "Bearer " + adminToken
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "Could not delete post.");
      return;
    }

    alert("Post deleted.");

    await loadPosts();

  } catch (error) {
    alert("Could not connect to the server.");
  }
}</script>

</body>
</html>
